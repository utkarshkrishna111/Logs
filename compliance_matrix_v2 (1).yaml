# compliance_matrix.yaml
# Compliance Scoring Matrix — edit to tune scoring without changing code

categories:

  market_manipulation:
    label: "Market Manipulation / Misconduct"
    base_weight: 10
    description: >
      Any communication that attempts to artificially influence
      market prices, volumes, or participant behaviour. Includes
      coordinated trading, front-running, wash trading, and
      pump-and-dump schemes.
    keywords:
      - "coordinate"
      - "push the price"
      - "front run"
      - "insider"
      - "price fix"
      - "rig the market"
      - "pump"
      - "dump"
      - "unload"
      - "wash trade"
      - "circular"

  bribery:
    label: "Market Bribery / Quid Pro Quo"
    base_weight: 9
    description: >
      Offering, giving, or accepting bribes, kickbacks, or improper
      payments to influence financial or business decisions. Includes
      gifts, hospitality, or retainers offered in exchange for
      preferential treatment.
    keywords:
      - "kickback"
      - "payment for favor"
      - "under the table"
      - "gift in exchange"
      - "bribe"
      - "quid pro quo"
      - "retainer"
      - "consulting fee"
      - "fast-track"
      - "thank-you"

  secrecy:
    label: "Secrecy / MNPI Leakage"
    base_weight: 7
    description: >
      Sharing material non-public information (MNPI) or confidential
      information with external or unauthorised parties. Does NOT apply
      to internal confidentiality reminders, board memos to board
      members, or legal hold instructions from the legal team.
    keywords:
      - "don't tell anyone"
      - "between us only"
      - "off the record"
      - "MNPI"
      - "you have time to position"
      - "delete this after reading"
      - "you didn't hear this from me"
      - "announcement is Thursday"
    legitimate_context_exclusions:
      - "board of directors"
      - "legal review"
      - "data breach notification"
      - "legal hold"
      - "NDA reminder"
      - "compliance reminder"

  employee_ethics:
    label: "Employee Ethics Violation"
    base_weight: 7
    description: >
      Conduct violating the organisation's code of ethics. Includes
      undisclosed conflicts of interest, personal account trading in
      securities the employee covers, side deals, policy violations,
      and analyst pressure to change ratings for commercial reasons.
    keywords:
      - "personal gain"
      - "conflict of interest"
      - "side deal"
      - "unauthorized trade"
      - "policy violation"
      - "personal account"
      - "brother-in-law"
      - "family member"
      - "neutralise the rating"
      - "underperform"
      - "fee-paying client"

  change_in_communication:
    label: "Change in Communication / Off-Channel"
    base_weight: 6
    description: >
      Deliberate attempts to move sensitive conversations to unmonitored
      channels to evade surveillance. Explicit requests to delete
      messages, use personal email or phone, or switch to encrypted
      apps in the context of deal discussions.
    keywords:
      - "use personal email"
      - "call me instead"
      - "don't put in writing"
      - "delete this"
      - "off channel"
      - "WhatsApp"
      - "Signal"
      - "Telegram"
      - "ProtonMail"
      - "paper trail"
      - "don't put anything in email"
      - "use my personal number"

  complaints:
    label: "Client / Regulatory Complaints"
    base_weight: 6
    description: >
      Formal or informal complaints, disputes, or grievances from
      clients or counterparties. Especially those involving financial
      losses, unauthorised transactions, or threats to escalate to
      regulators such as the FCA or SEC.
    keywords:
      - "complaint"
      - "dispute"
      - "unhappy"
      - "escalate"
      - "regulatory concern"
      - "legal action"
      - "unauthorised"
      - "without my knowledge"
      - "FCA"
      - "SEC"
      - "ombudsman"


# Categories the AI must NOT use — map to a valid category or mark compliant
out_of_scope_categories:
  - phishing
  - fraudulent_activity
  - fraudulent_communication
  - fraudulent_claims
  - false_advertising
  - HR-Policy-Update
  - Remote-Work-Guidelines
  - investment_policy_update
  - COI-Disclosure-Reminder
  - conflict_of_interest
  - insider_trading_risk
  - circular_trading

# Remap commonly invented sub-categories to the correct canonical ID
canonical_aliases:
  conflict_of_interest:  employee_ethics
  insider_trading_risk:  market_manipulation
  circular_trading:      market_manipulation
  wash_trading:          market_manipulation
  front_running:         market_manipulation
  kickbacks:             bribery
  off_channel:           change_in_communication
  data_leak:             secrecy
  mnpi_leak:             secrecy


scoring:

  confidence_thresholds:
    high:   0.80   # >= 0.80 -> Alert: HIGH
    medium: 0.55   # >= 0.55 -> Alert: MEDIUM
    low:    0.00   # <  0.55 -> Alert: LOW

  priority_bands:
    critical: 85   # score >= 85
    high:     65   # score >= 65
    medium:   40   # score >= 40
    low:       0

  multipliers:
    multi_category_bonus:     1.15   # applied when 2+ categories detected
    high_confidence_bonus:    1.10   # applied when confidence >= high threshold
    external_recipient_bonus: 1.10   # applied when email goes outside org

  # Normalisation ceiling — raw score is divided by this then multiplied by 100
  max_raw_score: 18

  per_category_score_cap:
    single_category: 90    # max score when only 1 category detected
    two_categories:  100   # no cap when 2+ categories detected


context_sensitivity:
  secrecy_legitimate_contexts:
    patterns:
      - description: "Board memo to board members"
        indicators:
          - "board of directors"
          - "intended solely for the board"
        action: "mark_compliant"

      - description: "Legal hold or legal review instruction"
        indicators:
          - "legal review"
          - "legal hold"
          - "do not discuss until legal"
        action: "reduce_confidence_by_0.35"

      - description: "Standard NDA or compliance reminder"
        indicators:
          - "NDA"
          - "compliance reminder"
          - "annual disclosure"
          - "open enrollment"
        action: "mark_compliant"

      - description: "Data breach notification during incident response"
        indicators:
          - "data breach notification"
          - "incident response"
          - "do not discuss externally until"
        action: "reduce_confidence_by_0.30"


guardrails:
  min_evidence_lines:          1
  min_reasoning_length:        40
  max_tokens_per_call:         2000
  enforce_canonical_categories: true
  min_confidence_for_flag:     0.60


output:
  results_dir:      "result"
  results_filename: "compliance_results.json"
  highlight_alert_levels:
    - "CRITICAL"
    - "HIGH"
